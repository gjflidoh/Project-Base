<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Stockaz — What Did I Even Sell Today?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_shared.css" />
<style>
  .receipt {
    position:absolute; width:60px; height:120px; background:#fff;
    box-shadow: 0 10px 18px rgba(0,0,0,.18);
    background-image: repeating-linear-gradient(to bottom, rgba(27,22,16,.12) 0, rgba(27,22,16,.12) 2px, transparent 2px, transparent 10px);
    opacity:0;
  }
  .receipt.drop { animation: drop .6s cubic-bezier(.3,.9,.4,1) forwards; }
  @keyframes drop { from { opacity:0; transform: translateY(-40px) rotate(0deg); } to { opacity:1; transform: translateY(0) rotate(var(--rot)); } }

  .calc {
    position:absolute; width:150px; height:110px; left:50%; top:60%; transform: translate(-50%,-50%);
    background:#2A2420; border-radius:10px; padding:10px; opacity:0;
  }
  .calc.show { animation: fadeIn .4s ease forwards; }
  .calc-screen { background:#9FB79A; border-radius:4px; height:34px; display:flex; align-items:center; justify-content:flex-end; padding:0 8px; }
  .calc-screen span { font-family: monospace; font-size:13px; color:#1B1610; letter-spacing:1px; }

  .bar-row { display:flex; align-items:flex-end; gap:10px; height:92px; padding: 0 6px; }
  .bar { width:24px; background: linear-gradient(180deg,#A08256,#7A5F3C); border-radius:6px 6px 2px 2px; height:0; transition: height .7s cubic-bezier(.2,.9,.2,1); }
  .bar-label { font-size:10px; font-weight:700; color:var(--faint); text-align:center; margin-top:4px; width:24px; }

  .period-chip { font-size:12px; font-weight:800; padding:7px 14px; border-radius:999px; border:1px solid var(--hairline); color: var(--sub); }
  .period-chip.active { background: var(--ink); color: #fff; border-color: var(--ink); }
</style>
</head>
<body>
<div class="stage" id="stage">

  <div class="notebook-stage" id="notebook">
    <div style="position:relative; width:78%; height:60%;">
      <div class="receipt" style="--rot:-14deg; left:10%; top:10%;" id="r1"></div>
      <div class="receipt" style="--rot:10deg; left:30%; top:20%;" id="r2"></div>
      <div class="receipt" style="--rot:-6deg; left:50%; top:4%;" id="r3"></div>
      <div class="receipt" style="--rot:16deg; left:68%; top:24%;" id="r4"></div>
      <div class="receipt" style="--rot:4deg; left:20%; top:40%;" id="r5"></div>
      <div class="calc" id="calc">
        <div class="calc-screen"><span id="calcDigits">4827.5190061772...</span></div>
      </div>
    </div>
  </div>

  <div class="phone-stage">
  <div class="phone-wrap" id="phoneWrap" style="opacity:0;">
    <div class="phone">
      <div class="notch"></div>
      <div class="phone-screen">
        <div class="app-header">
          <div>
            <div class="app-title">Reports</div>
            <div class="app-sub" id="txnCount">0 transactions</div>
          </div>
        </div>
        <div style="padding:0 20px 10px; display:flex; gap:8px;">
          <div class="period-chip active" id="chipToday">Today</div>
          <div class="period-chip" id="chipWeek">Week</div>
          <div class="period-chip" id="chipMonth">Month</div>
        </div>
        <div style="padding: 0 20px;">
          <div class="glass-card" style="padding:18px; box-shadow:none; border:1px solid var(--hairline);">
            <div style="font-size:11.5px; font-weight:800; letter-spacing:1px; color:var(--faint); text-transform:uppercase;">Total — Today</div>
            <div style="font-size:38px; font-weight:800; letter-spacing:-1px; margin-top:4px;">K<span id="total">0</span></div>
          </div>
        </div>
        <div style="padding: 16px 20px;">
          <div style="font-size:11.5px; font-weight:800; letter-spacing:1px; color:var(--faint); text-transform:uppercase; margin-bottom:10px;">Top sellers</div>
          <div class="bar-row">
            <div style="text-align:center;"><div class="bar" id="b1"></div><div class="bar-label">Beans</div></div>
            <div style="text-align:center;"><div class="bar" id="b2"></div><div class="bar-label">Bobo</div></div>
            <div style="text-align:center;"><div class="bar" id="b3"></div><div class="bar-label">Pilch.</div></div>
            <div style="text-align:center;"><div class="bar" id="b4"></div><div class="bar-label">Peri</div></div>
            <div style="text-align:center;"><div class="bar" id="b5"></div><div class="bar-label">Jelly</div></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  </div>

  <div class="outro" id="outro">
    <div class="outro-mark">Stock<span>az</span></div>
    <div class="outro-tag">Run your shop from your pocket.</div>
    <div class="outro-badge">FREE TO START</div>
  </div>

  <div class="caption-bar" id="cap"></div>
</div>

<script src="_shared.js"></script>
<script>
  const cap = document.getElementById('cap');
  const notebook = document.getElementById('notebook');
  const phoneWrap = document.getElementById('phoneWrap');
  const outro = document.getElementById('outro');

  caption(cap, 'NO IDEA WHAT ACTUALLY SOLD TODAY?', 300, 3000);
  caption(cap, 'ADDING IT UP BY HAND, EVERY NIGHT', 3200, 5500);
  caption(cap, 'STOCKAZ ADDS IT UP AS YOU SELL', 5700, 7500);
  caption(cap, 'TOTAL, TOP SELLERS, ALL IN ONE SCREEN', 7700, 12000);
  caption(cap, 'ZOOM OUT ANY TIME', 12200, 14000);
  caption(cap, 'STOCKAZ', 14300, 16000);

  ['r1','r2','r3','r4','r5'].forEach((id, i) => {
    setTimeout(() => document.getElementById(id).classList.add('drop'), 200 + i * 220);
  });
  setTimeout(() => document.getElementById('calc').classList.add('show'), 3300);
  setTimeout(() => notebook.classList.add('fadeout'), 5500);
  setTimeout(() => { phoneWrap.style.opacity = 1; phoneWrap.classList.add('pop-in'); }, 5800);

  countUp(document.getElementById('total'), 0, 3940, 6000, 1600, (n) => Math.round(n).toLocaleString('en-US'));
  countUp(document.getElementById('txnCount'), 0, 32, 6000, 1600, (n) => Math.round(n) + ' transactions');

  setTimeout(() => {
    document.getElementById('b1').style.height = '88px';
    document.getElementById('b2').style.height = '66px';
    document.getElementById('b3').style.height = '58px';
    document.getElementById('b4').style.height = '40px';
    document.getElementById('b5').style.height = '28px';
  }, 8200);

  setTimeout(() => {
    document.getElementById('chipToday').classList.remove('active');
    document.getElementById('chipWeek').classList.add('active');
    document.getElementById('b1').style.height = '70px';
    document.getElementById('b2').style.height = '84px';
    document.getElementById('b3').style.height = '46px';
    document.getElementById('b4').style.height = '60px';
    document.getElementById('b5').style.height = '36px';
  }, 12400);

  setTimeout(() => {
    document.getElementById('chipWeek').classList.remove('active');
    document.getElementById('chipMonth').classList.add('active');
    document.getElementById('b1').style.height = '90px';
    document.getElementById('b2').style.height = '60px';
    document.getElementById('b3').style.height = '72px';
    document.getElementById('b4').style.height = '50px';
    document.getElementById('b5').style.height = '44px';
  }, 13400);

  setTimeout(() => outro.classList.add('show'), 14500);
</script>
</body>
</html>
