<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Stockaz — The Notebook Problem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_shared.css" />
<style>
  .row { display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:16px; }
  .row img { width:42px; height:42px; border-radius:11px; object-fit:contain; background:var(--product-mat); flex:none; }
  .row .name { font-size:13.5px; font-weight:800; color:var(--ink); }
  .row .left { font-size:11.5px; font-weight:700; margin-top:1px; }
  .row .price { font-size:13.5px; font-weight:800; color:var(--ink); margin-left:auto; }
  .pencil {
    position: absolute; width: 10px; height: 90px; background: linear-gradient(#E8B54A,#C98A2E);
    border-radius: 4px; left: 54%; top: 18%; transform: rotate(28deg);
    box-shadow: 0 10px 20px rgba(0,0,0,.2);
  }
  .pencil::after { content:''; position:absolute; bottom:-10px; left:0; width:10px; height:12px; background:#2A2420; border-radius: 0 0 4px 4px; }
</style>
</head>
<body>
<div class="stage" id="stage">

  <div class="notebook-stage" id="notebook">
    <div class="notebook-page">
      <div class="handwrite">
        Heinz beans ......... 42<br/>
        Pilchards ........... 56<br/>
        <span class="strike" id="strike1">Peri Peri .......... 9</span><br/>
        Chicco Bobo ......... <span id="smudge">???</span><br/>
        Bleach powder ....... 6<br/>
      </div>
      <div class="pencil" id="pencil"></div>
    </div>
  </div>

  <div class="phone-stage">
  <div class="phone-wrap" id="phoneWrap" style="opacity:0;">
    <div class="phone">
      <div class="notch"></div>
      <div class="phone-screen">
        <div class="app-header">
          <div>
            <div class="app-title">Stock</div>
            <div class="app-sub">34 products</div>
          </div>
          <div class="pill ok">K <span id="stockValue">0</span></div>
        </div>
        <div style="padding:0 20px;">
          <div class="glass-card" style="padding:13px 16px; display:flex; align-items:center; gap:8px; height:46px;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="#9A8D7D" stroke-width="2"/><path d="M20 20l-4-4" stroke="#9A8D7D" stroke-width="2" stroke-linecap="round"/></svg>
            <span style="color:var(--ink); font-weight:700; font-size:14px;" id="searchText"></span>
            <span id="caret" style="width:2px; height:16px; background:var(--ink); display:inline-block;"></span>
          </div>
        </div>
        <div style="padding:14px 18px; display:flex; flex-direction:column; gap:8px;">

          <div class="row glass-card" id="rowPeri" style="box-shadow:none; border:1px solid var(--hairline);">
            <img src="../../assets/products/nandos-peri.png" />
            <div>
              <div class="name">Peri Peri</div>
              <div class="left" id="periLeft" style="color:var(--faint);">9 left</div>
            </div>
            <div class="price">K65.00</div>
          </div>

          <div class="row" style="opacity:.55;">
            <img src="../../assets/products/heinz-beans.png" />
            <div><div class="name">Heinz Beans</div><div class="left" style="color:var(--faint);">42 left</div></div>
            <div class="price">K25.00</div>
          </div>

          <div class="row" style="opacity:.55;">
            <img src="../../assets/products/pilchards.png" />
            <div><div class="name">Pilchards</div><div class="left" style="color:var(--faint);">56 left</div></div>
            <div class="price">K20.00</div>
          </div>

        </div>
      </div>
    </div>
  </div>
  </div>

  <div class="outro" id="outro">
    <div class="outro-mark">Stock<span>az</span></div>
    <div class="outro-tag">Run your shop from your pocket.</div>
    <div class="outro-badge">FREE TO START</div>
  </div>

  <div class="caption-bar" id="cap"></div>
</div>

<script src="_shared.js"></script>
<script>
  const cap = document.getElementById('cap');
  const notebook = document.getElementById('notebook');
  const phoneWrap = document.getElementById('phoneWrap');
  const outro = document.getElementById('outro');
  const searchText = document.getElementById('searchText');
  const periLeft = document.getElementById('periLeft');
  const rowPeri = document.getElementById('rowPeri');

  caption(cap, 'STILL COUNTING STOCK IN A NOTEBOOK?', 300, 3400);
  caption(cap, "ONE TORN PAGE AND YOU'VE LOST A WEEK", 3600, 6400);
  caption(cap, 'STOCKAZ KEEPS IT ON YOUR PHONE', 6600, 8400);
  caption(cap, 'SEE WHAT\'S LOW — INSTANTLY', 8600, 13000);
  caption(cap, 'YOUR WHOLE SHOP, AT A GLANCE', 13200, 14500);
  caption(cap, 'STOCKAZ', 14800, 17000);

  setTimeout(() => document.getElementById('strike1').classList.add('on'), 1400);
  setTimeout(() => { notebook.classList.add('fadeout'); }, 6400);
  setTimeout(() => { phoneWrap.style.opacity = 1; phoneWrap.classList.add('pop-in'); }, 6700);

  // type "peri" into search bar
  const typed = 'Peri Peri';
  setTimeout(() => {
    let i = 0;
    const iv = setInterval(() => {
      i++;
      searchText.textContent = typed.slice(0, i);
      if (i >= typed.length) clearInterval(iv);
    }, 70);
  }, 9000);
  setTimeout(() => { document.getElementById('caret').style.display = 'none'; }, 10100);

  // low-stock pulse once filtered result is "found"
  setTimeout(() => {
    rowPeri.style.border = '1px solid var(--warn)';
    rowPeri.style.animation = 'pulse 1.1s ease-in-out 2';
    periLeft.style.color = 'var(--warn)';
    periLeft.textContent = '9 left — low stock';
  }, 10400);

  countUp(document.getElementById('stockValue'), 0, 48210, 7000, 1800, (n) => Math.round(n).toLocaleString('en-US'));

  setTimeout(() => outro.classList.add('show'), 14600);
  runTimeline([]);
</script>
</body>
</html>
