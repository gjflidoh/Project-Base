name: Build Android Debug APK

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/stockaz-mobile-app-nfme1m
    paths-ignore:
      - '**.md'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: stockaz-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # The Actions artifact above is served from Azure Blob Storage, which
      # some network policies (including the sandbox this was authored in)
      # block. Also publish the APK to a plain git branch so it can be
      # fetched with a normal `git fetch` against github.com instead.
      - name: Publish APK to the apk-builds branch
        run: |
          set -e
          mkdir -p /tmp/apk-publish
          # The raw debug APK is >100MB, over GitHub's git blob limit, but it
          # zips down comfortably under that (mostly-incompressible content
          # like native .so libs still yields ~35% smaller here) — zip it
          # instead of pushing the raw file.
          cd android/app/build/outputs/apk/debug
          zip -q -9 /tmp/apk-publish/stockaz-debug.apk.zip app-debug.apk
          cd /tmp/apk-publish
          ls -la
          git init -q -b apk-builds
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stockaz-debug.apk.zip
          git commit -q -m "Debug APK from run ${{ github.run_id }} (${{ github.sha }})"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -f origin apk-builds
